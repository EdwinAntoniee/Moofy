<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moofy — Gemini Canvas Interactive Preview</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;0,6..96,700;0,6..96,800;1,6..96,400;1,6..96,600&family=Cinzel:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- React & Babel CDNs for 1-Click Interactive Gemini Canvas Execution -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-base: #0c0c0e;
      --bg-surface: rgba(255, 255, 255, 0.025);
      --bg-surface-elevated: rgba(255, 255, 255, 0.045);
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-medium: rgba(255, 255, 255, 0.14);
      --border-accent: rgba(200, 170, 118, 0.35);

      --accent-gold: #c8aa76;
      --accent-sand: #e6dfd3;

      --text-primary: #f4f4ee;
      --text-secondary: #9c9c94;
      --text-muted: #62625b;

      --font-serif: 'Bodoni Moda', 'Cinzel', Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      /* Editorial Emotion Palette */
      --emo-joy: #dca365;
      --emo-love: #cf8484;
      --emo-surprise: #a89bc2;
      --emo-sadness: #7890a8;
      --emo-fear: #739682;
      --emo-anger: #bf6363;

      --radius-xs: 4px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      line-height: 1.6;
      background-image: 
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(200, 170, 118, 0.05) 0%, transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(255, 255, 255, 0.015) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(255, 255, 255, 0.015) 0%, transparent 40%);
    }

    .editorial-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
    }
    .editorial-card:hover {
      background: var(--bg-surface-elevated);
      border-color: var(--border-medium);
    }

    .btn-primary {
      background-color: #f4f4ee;
      color: #0c0c0e;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.65rem 1.4rem;
      border-radius: var(--radius-sm);
      border: 1px solid #f4f4ee;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.25s ease;
    }
    .btn-primary:hover {
      background-color: #ffffff;
      box-shadow: 0 4px 15px rgba(244, 244, 238, 0.15);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text-primary);
      font-weight: 500;
      font-size: 0.85rem;
      padding: 0.65rem 1.15rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.25s ease;
    }
    .btn-secondary:hover {
      background-color: var(--bg-surface-elevated);
      border-color: var(--border-medium);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const MOCK_MOVIES = [
      {
        movie_id: 1022789,
        title: "Inside Out 2",
        overview: "Teenager Riley's mind headquarters is undergoing a sudden demolition to make room for unexpected new Emotions: Anxiety, Envy, Ennui, and Embarrassment.",
        poster_path: "/vpnVM9B6NMmQpWeZvzLvDESb2QY.jpg",
        backdrop_path: "/stKGOmPAneQ6kyZtS7vlaL72L98.jpg",
        release_date: "2024-06-11",
        vote_average: 7.6,
        emotion_label: "Sadness",
        hybrid_score: 0.94,
        genres: ["Animation", "Family", "Adventure"]
      },
      {
        movie_id: 19995,
        title: "Lost in Translation",
        overview: "Two lonely Americans form an unlikely bond after crossing paths in Tokyo, finding comfort in their shared melancholy and disorientation.",
        poster_path: "/wkSZSOkiYy8LErdhqqd3apqTRx3.jpg",
        backdrop_path: "/7x92dOaBcfbL18G2p891sN9fO01.jpg",
        release_date: "2003-09-18",
        vote_average: 7.4,
        emotion_label: "Sadness",
        hybrid_score: 0.88,
        genres: ["Drama", "Romance"]
      },
      {
        movie_id: 19913,
        title: "(500) Days of Summer",
        overview: "An offbeat romantic comedy about a woman who doesn't believe true love exists, and the young man who falls head over heels for her.",
        poster_path: "/qXAuQ9hF30sQRsXf40OfRVl0MJZ.jpg",
        backdrop_path: "/f8Z8Z3v3Y9Zg3M6u7p0h9o9f9.jpg",
        release_date: "2009-07-17",
        vote_average: 7.3,
        emotion_label: "Sadness",
        hybrid_score: 0.84,
        genres: ["Comedy", "Drama", "Romance"]
      },
      {
        movie_id: 157336,
        title: "Interstellar",
        overview: "The adventures of a group of explorers who make use of a newly discovered wormhole to surpass the limitations on human space travel.",
        poster_path: "/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg",
        backdrop_path: "/xJHokMbljvjADYdit5fK5VQsXEG.jpg",
        release_date: "2014-11-05",
        vote_average: 8.5,
        emotion_label: "Joy",
        hybrid_score: 0.82,
        genres: ["Adventure", "Drama", "Sci-Fi"]
      }
    ];

    function App() {
      const [prompt, setPrompt] = useState("I am feeling overwhelmed with college assignments and need a gentle, comforting story");
      const [alpha, setAlpha] = useState(0.5);
      const [selectedMovie, setSelectedMovie] = useState(null);
      const [watchlist, setWatchlist] = useState({});

      const toggleWatchlist = (movie) => {
        setWatchlist(prev => {
          const next = { ...prev };
          if (next[movie.movie_id]) delete next[movie.movie_id];
          else next[movie.movie_id] = true;
          return next;
        });
      };

      return (
        <div>
          {/* Header */}
          <header style={{
            padding: '1rem 2rem',
            borderBottom: '1px solid var(--border-subtle)',
            display: 'flex',
            justifyContent: 'space-between',
            alignItems: 'baseline'
          }}>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: '0.6rem' }}>
              <span style={{ fontFamily: 'var(--font-serif)', fontSize: '1.4rem', fontWeight: '700', letterSpacing: '3px' }}>MOOFY</span>
              <span style={{ fontSize: '0.65rem', color: 'var(--accent-gold)', letterSpacing: '2px', fontFamily: 'var(--font-mono)' }}>CINEMA ARCHIVE</span>
            </div>
            <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)', fontFamily: 'var(--font-mono)' }}>
              A24 / EDITORIAL EDITION
            </div>
          </header>

          {/* Hero */}
          <div style={{ maxWidth: '800px', margin: '3.5rem auto 1.5rem auto', textAlign: 'center', padding: '0 1.5rem' }}>
            <h1 style={{ fontFamily: 'var(--font-serif)', fontSize: 'clamp(2.2rem, 5vw, 3.6rem)', fontStyle: 'italic', fontWeight: '400', lineHeight: '1.2', marginBottom: '1rem' }}>
              What do you feel like watching?
            </h1>
            <p style={{ color: 'var(--text-secondary)', fontSize: '0.95rem', maxWidth: '520px', margin: '0 auto' }}>
              Describe the mood. We'll find the movie.
            </p>
          </div>

          {/* Search Box */}
          <div style={{ maxWidth: '750px', margin: '0 auto', padding: '0 1.5rem' }}>
            <div className="editorial-card" style={{ padding: '1.5rem' }}>
              <textarea
                rows={3}
                value={prompt}
                onChange={e => setPrompt(e.target.value)}
                style={{
                  width: '100%',
                  backgroundColor: 'rgba(0,0,0,0.35)',
                  border: '1px solid var(--border-subtle)',
                  borderRadius: 'var(--radius-xs)',
                  color: 'var(--text-primary)',
                  padding: '0.85rem 1rem',
                  fontSize: '0.9rem',
                  fontFamily: 'inherit',
                  marginBottom: '1rem',
                  outline: 'none'
                }}
              />

              {/* Slider */}
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: '0.75rem', fontFamily: 'var(--font-mono)', color: 'var(--text-muted)', marginBottom: '0.5rem' }}>
                <span>EMOTION ({(100 - alpha * 100).toFixed(0)}%)</span>
                <span style={{ color: 'var(--accent-gold)' }}>50/50 Balanced Synthesis</span>
                <span>STORY ({(alpha * 100).toFixed(0)}%)</span>
              </div>
              <input
                type="range"
                min="0" max="1" step="0.05"
                value={alpha}
                onChange={e => setAlpha(parseFloat(e.target.value))}
                style={{ width: '100%', accentColor: 'var(--accent-gold)', marginBottom: '1.25rem', height: '4px' }}
              />

              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)', fontFamily: 'var(--font-mono)' }}>Quality Rating Filter Active</span>
                <button className="btn-primary">Find Screenings →</button>
              </div>
            </div>
          </div>

          {/* Emotion Vector Visualizer */}
          <div style={{ maxWidth: '750px', margin: '2rem auto', padding: '0 1.5rem' }}>
            <div className="editorial-card" style={{ padding: '1.25rem 1.5rem', borderLeft: '3px solid var(--emo-sadness)' }}>
              <span style={{ fontSize: '0.65rem', color: 'var(--text-muted)', letterSpacing: '1.5px', textTransform: 'uppercase', fontFamily: 'var(--font-mono)' }}>
                Detected Sentiment
              </span>
              <h3 style={{ fontFamily: 'var(--font-serif)', fontSize: '1.3rem', fontStyle: 'italic', marginBottom: '1rem' }}>
                Sadness <span style={{ fontSize: '0.85rem', fontStyle: 'normal', color: 'var(--text-secondary)' }}>— Melancholy & Reflection</span>
              </h3>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(90px, 1fr))', gap: '0.5rem' }}>
                {[
                  { name: 'Sadness', pct: 92, col: 'var(--emo-sadness)' },
                  { name: 'Fear', pct: 4, col: 'var(--emo-fear)' },
                  { name: 'Love', pct: 2, col: 'var(--emo-love)' },
                  { name: 'Joy', pct: 1, col: 'var(--emo-joy)' },
                  { name: 'Surprise', pct: 1, col: 'var(--emo-surprise)' },
                  { name: 'Anger', pct: 0, col: 'var(--emo-anger)' },
                ].map(e => (
                  <div key={e.name} style={{ border: '1px solid var(--border-subtle)', padding: '0.4rem 0.5rem', borderRadius: 'var(--radius-xs)' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.7rem', marginBottom: '0.2rem' }}>
                      <span>{e.name}</span>
                      <span style={{ color: e.col, fontFamily: 'var(--font-mono)' }}>{e.pct}%</span>
                    </div>
                    <div style={{ width: '100%', height: '2px', backgroundColor: 'rgba(255,255,255,0.06)' }}>
                      <div style={{ width: `${e.pct}%`, height: '100%', backgroundColor: e.col }} />
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* 4-Movie Grid */}
          <div style={{ maxWidth: '1100px', margin: '3rem auto 6rem auto', padding: '0 1.5rem' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: '1.5rem', borderBottom: '1px solid var(--border-subtle)', paddingBottom: '0.75rem' }}>
              <h2 style={{ fontFamily: 'var(--font-serif)', fontSize: '1.3rem', fontStyle: 'italic' }}>
                Movie Matches
              </h2>
              <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)', fontFamily: 'var(--font-mono)' }}>Sorted by TMDB Rating</span>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(230px, 1fr))', gap: '1.5rem' }}>
              {MOCK_MOVIES.map(m => (
                <div 
                  key={m.movie_id} 
                  className="editorial-card" 
                  onClick={() => setSelectedMovie(m)}
                  style={{ display: 'flex', flexDirection: 'column', overflow: 'hidden', cursor: 'pointer' }}
                >
                  <div style={{ position: 'relative', width: '100%', paddingTop: '148%', backgroundColor: '#151518' }}>
                    <img 
                      src={`https://image.tmdb.org/t/p/w500${m.poster_path}`} 
                      alt={m.title}
                      style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover' }} 
                    />
                    <div style={{ position: 'absolute', top: '10px', left: '10px', backgroundColor: 'rgba(12,12,14,0.85)', padding: '2px 7px', borderRadius: 'var(--radius-xs)', fontSize: '0.7rem', fontFamily: 'var(--font-mono)' }}>
                      ★ {m.vote_average}
                    </div>
                    <div style={{ position: 'absolute', top: '10px', right: '10px', backgroundColor: 'rgba(12,12,14,0.85)', color: 'var(--accent-gold)', padding: '2px 7px', borderRadius: 'var(--radius-xs)', fontSize: '0.7rem', fontFamily: 'var(--font-mono)' }}>
                      {Math.round(m.hybrid_score * 100)}% MATCH
                    </div>
                  </div>

                  <div style={{ padding: '1rem', display: 'flex', flexDirection: 'column', flex: 1, justifyContent: 'space-between' }}>
                    <div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: '0.35rem' }}>
                        <h4 style={{ fontFamily: 'var(--font-serif)', fontSize: '1.05rem' }}>{m.title}</h4>
                        <span style={{ fontSize: '0.7rem', color: 'var(--text-muted)', fontFamily: 'var(--font-mono)' }}>{m.release_date.substring(0,4)}</span>
                      </div>
                      <p style={{ fontSize: '0.78rem', color: 'var(--text-secondary)', lineHeight: '1.4', display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>
                        {m.overview}
                      </p>
                    </div>

                    <div style={{ display: 'flex', gap: '0.4rem', paddingTop: '0.65rem', borderTop: '1px solid var(--border-subtle)', marginTop: '0.75rem' }}>
                      <button 
                        onClick={(e) => { e.stopPropagation(); toggleWatchlist(m, 'plan_to_watch'); }}
                        style={{
                          flex: 1,
                          backgroundColor: watchlist[m.movie_id] === 'plan_to_watch' ? 'rgba(200, 170, 118, 0.18)' : 'transparent',
                          border: watchlist[m.movie_id] === 'plan_to_watch' ? '1px solid var(--accent-gold)' : '1px solid var(--border-subtle)',
                          color: watchlist[m.movie_id] === 'plan_to_watch' ? 'var(--accent-gold)' : 'var(--text-primary)',
                          padding: '0.4rem',
                          borderRadius: 'var(--radius-xs)',
                          fontSize: '0.72rem',
                          fontFamily: 'var(--font-mono)',
                          cursor: 'pointer'
                        }}
                      >
                        {watchlist[m.movie_id] === 'plan_to_watch' ? 'In Queue' : 'Queue'}
                      </button>

                      <button 
                        onClick={(e) => { e.stopPropagation(); toggleWatchlist(m, 'watched'); }}
                        style={{
                          flex: 1,
                          backgroundColor: watchlist[m.movie_id] === 'watched' ? 'rgba(120, 180, 140, 0.18)' : 'transparent',
                          border: watchlist[m.movie_id] === 'watched' ? '1px solid #739682' : '1px solid var(--border-subtle)',
                          color: watchlist[m.movie_id] === 'watched' ? '#a3d4b6' : 'var(--text-primary)',
                          padding: '0.4rem',
                          borderRadius: 'var(--radius-xs)',
                          fontSize: '0.72rem',
                          fontFamily: 'var(--font-mono)',
                          cursor: 'pointer'
                        }}
                      >
                        {watchlist[m.movie_id] === 'watched' ? 'Watched' : 'Watched'}
                      </button>
                    </div>
                  </div>
                </div>
              ))}
            </div>

            <div style={{ textAlign: 'center', marginTop: '2.5rem' }}>
              <button className="btn-secondary" style={{ fontSize: '0.8rem', padding: '0.65rem 1.5rem' }}>
                More Films ↓
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
